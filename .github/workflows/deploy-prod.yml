name: Deploy Production

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run tests (Placeholder)
        run: |
          echo "No unit tests configured yet. Placeholder step passed."

      - name: Build static bundle
        run: npm run build
        # Set environment variables for production build
        # env:

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  versioning:
    name: Versioning
    needs: lint-test-build
    uses: SuikaStudio/ci-workflows/.github/workflows/versioning.yml@main
    with:
      branch: main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [lint-test-build, versioning]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Download changelog artifact
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: /tmp

      - name: Read changelog
        id: changelog
        run: |
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.new_tag }}
          name: ${{ needs.versioning.outputs.new_tag }}
          body: ${{ steps.changelog.outputs.content }}
          prerelease: false
