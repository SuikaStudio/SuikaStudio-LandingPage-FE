name: PR Check

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint-and-test:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run tests (Placeholder)
        run: |
          echo "No unit tests configured yet. Placeholder step passed."
